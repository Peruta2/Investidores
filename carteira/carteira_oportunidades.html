<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Oportunidades - Minha Carteira</title>
    <!-- Folha de Estilos Unificada do Sistema -->
    <link rel="stylesheet" href="../css/carteira.css">
    <style>
        body {
            background-color: var(--azul-marinho);
            margin: 0;
            padding: 30px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--branco);
        }
        .header-modulo h1 {
            color: var(--laranja-claro-dourado);
            margin: 0 0 25px 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(229, 196, 149, 0.2);
            padding-bottom: 10px;
        }
        
        /* ➔ FORÇA HORIZONTAL RÍGIDA: Alinha os 5 cards de ponta a ponta na horizontal sem quebrar */
        .grid-cards-horizontal {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            gap: 15px !important;
            margin-bottom: 30px !important;
            width: 100% !important;
        }
        .grid-cards-horizontal .kpi-card {
            flex: 1 !important; /* Distribui tamanhos perfeitamente iguais */
            min-width: 0 !important;
        }

        .secao-tabela-bloco {
            margin-bottom: 35px;
            background-color: var(--azul-escuro-tab);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .status-msg {
            padding: 30px;
            text-align: center;
            color: var(--cinza-claro-azulado);
            font-style: italic;
        }

        /* CLASSE DE CAMUFLAGEM: Oculta as colunas 11 a 16 */
        .col-simulador {
            display: none !important;
        }
        
        /* Força a coluna td a abrir espaço para acomodar o input sem espremer */
        td.col-simulador {
            min-width: 100px !important;
            white-space: nowrap !important;
        }

        /* Exibe as células td quando o simulador for acionado */
        tr.mostrar-simulador td.col-simulador {
            display: table-cell !important;
        }

        /* Coluna do Botão de 3 Pontos */
        .coluna-acao-tres-pontos {
            text-align: center;
            position: relative;
            width: 45px;
        }

        .btn-tres-pontos {
            background: transparent;
            border: none;
            color: inherit; /* Herda a cor do texto e do hover da linha de forma 100% orgânica */
            font-size: 18px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-weight: bold;
            line-height: 1;
            display: inline-block;
        }
        .btn-tres-pontos:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ➔ CALIBRAÇÃO DE CORES DEFINITIVA: Contraste Máximo para Leitura Perfeita */
        .input-simulador-qtd {
            width: 70px !important; /* Largura ideal para os números respirarem */
            background-color: #2c3e50 !important; /* Grafite Executivo: Clareado para dar contraste real */
            border: 1px solid rgba(255, 255, 255, 0.4) !important; /* Borda nítida */
            color: #FFFFFF !important; /* Letra branca pura e brilhante para enxergar de longe */
            border-radius: 4px;
            padding: 4px 6px !important; 
            font-size: 12px !important; /* Fonte sutilmente maior para facilitar a batida de olho */
            font-weight: bold !important;
            text-align: center !important; /* Números alinhados à direita como em relatórios corporativos */
            box-sizing: border-box;
        }
        .input-simulador-qtd:focus {
            outline: none;
            border-color: #10B981 !important; /* Borda verde ativa */
            background-color: #34495e !important; /* Fundo acende ao digitar */
        }

    </style>
</head>
<body>

    <div class="header-modulo">
        <h1>Módulo 3: Radar de Oportunidades & Simulador</h1>
    </div>

    <!-- ➔ GRID TRAVADO NA HORIZONTAL -->
    <div id="kpi-cards-oportunidades-container" class="grid-cards-horizontal">
        <div class="status-msg">Carregando painel de simulação ativa...</div>
    </div>

    <!-- RECEPTOR DA GRADE DE OPORTUNIDADES ID 50 -->
    <div class="secao-tabela-bloco">
        <div class="table-container" id="container-id50-tabela">
            <div class="status-msg">Processando matrizes de valuation, upside e radar...</div>
        </div>
    </div>

    <link rel="icon" href="data:,">
    <!-- Acoplamento do Sistema Gráfico e do Processador Matemático Independente -->
    <script src="../js/carteira_oportunidades.js"></script>
    <script src="../js/carteira_simulador.js"></script>
</body>
</html>
