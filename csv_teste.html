<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ler arquivo CSV</title>
    <!-- Biblioteca PapaParse -->
    <script src="dados.csv"></script>
</head>
<body>

    <h1>Dados Locais do CSV</h1>
    <div id="tabela-conteudo">Carregando dados...</div>

    <script>
        const arquivoCsv = 'dados.csv'; 

        fetch(arquivoCsv)
            .then(resposta => {
                if (!resposta.ok) {
                    throw new Error('Não foi possível carregar o arquivo CSV.');
                }
                return resposta.text();
            })
            .then(textoCsv => {
                Papa.parse(textoCsv, {
                    header: true,
                    skipEmptyLines: true,
                    delimiter: ";", // OBS: Força o script a entender o ponto e vírgula
                    complete: function(resultado) {
                        gerarTabela(resultado.data);
                    }
                });
            })
            .catch(erro => {
                document.getElementById('tabela-conteudo').innerText = 'Erro ao carregar dados.';
                console.error(erro);
            });

        function gerarTabela(dados) {
            if (dados.length === 0) {
                document.getElementById('tabela-conteudo').innerText = 'Nenhum dado encontrado.';
                return;
            }

            let html = '<table border="1"><thead><tr>';
            
            // Pega os cabeçalhos a partir da primeira linha de dados
            Object.keys(dados[0]).forEach(coluna => {
                html += `<th>${coluna}</th>`;
            });
            html += '</tr></thead><tbody>';

            // Preenche as linhas corretamente
            dados.forEach(linha => {
                html += '<tr>'; // Corrigido aqui: adicionado as tags <>
                Object.values(linha).forEach(valor => {
                    html += `<td>${valor}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';

            document.getElementById('tabela-conteudo').innerHTML = html;
        }
    </script>
</body>
</html>
