<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ler Arquivos CSV</title>
    <style>
        /* Estilos fontes enviados por você */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a; /* Fundo escuro idêntico ao modelo */
            color: #f8fafc;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }
        h1 {
            color: #38bdf8; /* Azul destaque */
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        h2 {
            color: #e2e8f0;
            font-size: 18px;
            margin-top: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            max-width: 800px;
        }
        ul {
            color: #cbd5e1;
            font-size: 15px;
            padding-left: 20px;
            max-width: 800px;
        }
        li {
            margin-bottom: 5px;
        }

        /* Adaptação da Tabela para o Modo Escuro */
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .db-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b; /* Fundo ligeiramente mais claro para a tabela */
            font-size: 15px;
        }
        .db-table th, .db-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .db-table th {
            background-color: #334155; /* Fundo cinza escuro */
            color: #ffffff; /* Letras brancas */
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.05em;
        }
        /* Corrigido: efeito hover agora usa um azul suave que destaca no fundo escuro */
        .db-table tbody tr:hover {
            /* background-color: rgba(56, 189, 248, 0.15); */
            background-color: #1e293b;
            cursor: pointer;
        }
        .db-table tr:last-child td {
            border-bottom: none;
        }

        /* Estilo para as tags de status */
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
        }
        .status-aguardando {
            background-color: #7c2d12; /* Fundo laranja escuro */
            color: #ffedd5; /* Texto laranja claro */
            border: 1px solid #ea580c;
        }
    </style>
</head>
<body>

    <h1>Ler Arquivos CSV</h1>
    <p>Abaixo temos relacionados a data de divulgação dos relatórios trimestrais.</p>

    <h2>Cronograma 2T26 - Data de Divulgação</h2>
    <div class="table-container">
        <table class="db-table">
            <thead>
                <tr>
                    <th>SIM</th>
                    <th>AÇÃO</th>
                    <th>DATA</th>
                    <th>RELATÓRIO</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="dados-tabela">
                <!-- As linhas do dados.csv serão injetadas aqui -->
            </tbody>
        </table>
    </div>

    <script>
        async function carregarDados() {
            try {
                const resposta = await fetch('dados.csv');
                const texto = await resposta.text();
                
                const linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const tbody = document.getElementById('dados-tabela');
                
                tbody.innerHTML = '';

                for (let i = 1; i < linhas.length; i++) {
                    const colunas = linhas[i].split(','); 
                    const tr = document.createElement('tr');
                    
                    colunas.forEach((valor, index) => {
                        const td = document.createElement('td');
                        td.textContent = valor;
                        
                        if (index === 4) {
                            td.textContent = ''; 
                            const badge = document.createElement('span');
                            badge.textContent = valor;
                            badge.classList.add('status-badge');
                            
                            if (valor.trim() === 'Aguardando') {
                                badge.classList.add('status-aguardando');
                            }
                            td.appendChild(badge);
                        }
                        
                        tr.appendChild(td);
                    });
                    
                    tbody.appendChild(tr);
                }
            } catch (erro) {
                console.error("Erro ao ler o arquivo dados.csv:", erro);
            }
        }

        window.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
