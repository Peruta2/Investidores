<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Status</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { display: flex; align-items: center; gap: 10px; }
        input[readonly] { background-color: #f0f0f0; border: 1px solid #ccc; padding: 5px; }
        input:not([readonly]) { background-color: #fff; border: 1px solid #007BFF; padding: 5px; }
        button { padding: 6px 12px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Atualizar Status do CSV</h2>
    <div class="container">
        <label for="statusInput">STATUS:</label>
        <!-- Simulando a linha 1 do seu CSV. Mude o ID da linha se necessário -->
        <input type="text" id="statusInput" value="Carregando..." readonly>
        <button id="btnAcao" onclick="alternarModo()">Editar</button>
    </div>

    <script>
        const input = document.getElementById('statusInput');
        const botao = document.getElementById('btnAcao');
        const ID_LINHA = 1; // Define qual linha do CSV você quer editar

        // Busca o status atual ao abrir a página
        async function buscarStatus() {
            try {
                const response = await fetch(`/get-status?linha=${ID_LINHA}`);
                const data = await response.json();
                input.value = data.status;
            } catch (err) {
                input.value = "Erro ao carregar";
            }
        }

        async function alternarModo() {
            if (botao.textContent === "Editar") {
                // Ativa o modo de edição
                input.removeAttribute('readonly');
                input.focus();
                botao.textContent = "Commit";
            } else {
                // Modo "Commit" - Salva a alteração
                botao.disabled = true;
                botao.textContent = "Salvando...";

                try {
                    const response = await fetch('/update-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ linha: ID_LINHA, novo_status: input.value })
                    });

                    if (response.ok) {
                        alert("Alteração salva com sucesso!");
                    } else {
                        alert("Erro ao salvar no CSV.");
                    }
                } catch (err) {
                    alert("Erro de conexão com o servidor.");
                }

                // Bloqueia o campo novamente e volta o botão para Editar
                input.setAttribute('readonly', 'true');
                botao.textContent = "Editar";
                botao.disabled = false;
            }
        }

        // Inicializa a página buscando o dado correto
        buscarStatus();
    </script>
</body>
</html>
