<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ler Arquivos CSV</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        table { border-collapse: collapse; width: 100%; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; text-transform: uppercase; }
        tr:hover { background-color: #f1f1f1; }
        .status-aguardando { background-color: #ffeeba; color: #856404; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .erro-alerta { color: white; background-color: #dc3545; padding: 15px; border-radius: 4px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Cronograma de Relatórios (3Q26 / 4Q26)</h1>
    <div id="tabela-conteudo">Carregando dados...</div>

    <script>
        // Busca o arquivo forçando o GitHub a não usar o cache antigo
        const urlComCacheBuster = 'dados.csv?v=' + String(new Date().getTime());

        fetch(urlComCacheBuster)
            .then(resposta => {
                if (!resposta.ok) {
                    throw new Error('O arquivo dados.csv não foi encontrado no servidor (Erro ' + resposta.status + ').');
                }
                return resposta.text();
            })
            .then(textoCsv => {
                // Processa o CSV usando apenas funções nativas do JavaScript (Sem PapaParse!)
                const linhas = textoCsv.split('\n').map(linha => linha.trim()).filter(linha => linha !== '');
                
                if (linhas.length === 0) {
                    throw new Error('O arquivo dados.csv está vazio.');
                }

                // Pega a primeira linha como cabeçalho (sim, ação, data, relatório, status)
                const colunas = linhas[0].split(',');

                // Monta a estrutura da tabela
                let html = '<table><thead><tr>';
                colunas.forEach(coluna => {
                    html += `<th>${coluna}</th>`;
                });
                html += '</tr></thead><tbody>';

                // Preenche as linhas de dados (Apple, Amazon, etc.)
                for (let i = 1; i < linhas.length; i++) {
                    const valores = linhas[i].split(',');
                    
                    // Garante que a linha tem o mesmo número de colunas do cabeçalho
                    if (valores.length === colunas.length) {
                        html += '<tr>';
                        valores.forEach((valor, index) => {
                            const nomeColuna = colunas[index].toLowerCase().trim();
                            const valorTratado = valor.trim();

                            // Destaca visualmente se a coluna for status e o valor for Aguardando
                            if (nomeColuna === 'status' && valorTratado.toLowerCase() === 'aguardando') {
                                html += `<td><span class="status-aguardando">${valorTratado}</span></td>`;
                            } else {
                                html += `<td>${valorTratado}</td>`;
                            }
                        });
                        html += '</tr>';
                    }
                }

                html += '</tbody></table>';
                document.getElementById('tabela-conteudo').innerHTML = html;
            })
            .catch(erro => {
                document.getElementById('tabela-conteudo').innerHTML = `<div class="erro-alerta">❌ ${erro.message}</div>`;
            });
    </script>
</body>
</html>
