<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Relatórios</title>
    <style>
        /* Estilos baseados na referência visual que você enviou */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #ffffff;
        }
        .table-container {
            overflow-x: auto;
            margin-top: 15px;
        }
        .db-table {
            width: 100%;
            border-collapse: collapse;
        }
        .db-table th, .db-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .db-table th {
            background-color: #f2f2f2;
            font-weight: bold;
            text-transform: uppercase;
        }
        .db-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        /* Estilo extra opcional para destacar o status "Aguardando" */
        .status-aguardando {
            color: #d97706;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Histórico de Indicadores Fundamentais</h2>
    <div class="table-container">
        <table class="db-table">
            <thead>
                <tr>
                    <th>SIM</th>
                    <th>AÇÃO</th>
                    <th>DATA</th>
                    <th>RELATÓRIO</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="dados-tabela">
                <!-- As linhas do dados.csv serão injetadas aqui -->
            </tbody>
        </table>
    </div>

    <script>
        async function carregarDados() {
            try {
                const resposta = await fetch('dados.csv');
                const texto = await resposta.text();
                
                // Divide por linhas e remove linhas em branco
                const linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const tbody = document.getElementById('dados-tabela');
                
                tbody.innerHTML = '';

                // Pula a primeira linha (cabeçalho do CSV: sim,ação,data...)
                for (let i = 1; i < linhas.length; i++) {
                    const colunas = linhas[i].split(','); 
                    
                    const tr = document.createElement('tr');
                    
                    colunas.forEach((valor, index) => {
                        const td = document.createElement('td');
                        td.textContent = valor;
                        
                        // Se for a coluna de Status (índice 4) e for "Aguardando", aplica uma classe de destaque
                        if (index === 4 && valor.trim() === 'Aguardando') {
                            td.classList.add('status-aguardando');
                        }
                        
                        tr.appendChild(td);
                    });
                    
                    tbody.appendChild(tr);
                }
            } catch (erro) {
                console.error("Erro ao ler o arquivo dados.csv:", erro);
            }
        }

        window.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
