<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ler Arquivos CSV</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        table { border-collapse: collapse; width: 100%; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; text-transform: uppercase; }
        tr:hover { background-color: #f1f1f1; }
        .status-aguardando { background-color: #ffeeba; color: #856404; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .erro-alerta { color: white; background-color: #dc3545; padding: 15px; border-radius: 4px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Cronograma de Relatórios (3Q26 / 4Q26)</h1>
    <div id="tabela-conteudo">Carregando dados...</div>

    <script>
        // Gera um código único baseado na hora atual para burlar o cache do GitHub
        const linkComVersao = 'dados.csv?v=' + String(new Date().getTime());

        fetch(linkComVersao)
            .then(resposta => {
                if (!resposta.ok) {
                    throw new Error('O arquivo dados.csv não foi encontrado no GitHub (Erro ' + resposta.status + ').');
                }
                return resposta.text();
            })
            .then(textoCompleto => {
                // Quebra o texto bruto em linhas individuais
                const linhasDoArquivo = textoCompleto.split('\n').map(l => l.trim()).filter(l => l !== '');
                
                if (linhasDoArquivo.length === 0) {
                    throw new Error('O arquivo dados.csv está totalmente vazio.');
                }

                // Pega os cabeçalhos da primeira linha (sim, ação, data, relatório, status)
                const cabecalhos = linhasDoArquivo[0].split(',');

                let htmlTabela = '<table><thead><tr>';
                cabecalhos.forEach(coluna => {
                    htmlTabela += `<th>${coluna}</th>`;
                });
                htmlTabela += '</tr></thead><tbody>';

                // Varre as linhas seguintes montando os dados das empresas
                for (let i = 1; i < linhasDoArquivo.length; i++) {
                    const colunasDaLinha = linhasDoArquivo[i].split(',');
                    
                    if (colunasDaLinha.length === cabecalhos.length) {
                        htmlTabela += '<tr>';
                        colunasDaLinha.forEach((valor, index) => {
                            const nomeColunaOriginal = cabecalhos[index].toLowerCase().trim();
                            const textoValor = valor.trim();

                            // Destaca com fundo amarelo se o status for "Aguardando"
                            if (nomeColunaOriginal === 'status' && textoValor.toLowerCase() === 'aguardando') {
                                htmlTabela += `<td><span class="status-aguardando">${textoValor}</span></td>`;
                            } else {
                                htmlTabela += `<td>${textoValor}</td>`;
                            }
                        });
                        htmlTabela += '</tr>';
                    }
                }

                htmlTabela += '</tbody></table>';
                document.getElementById('tabela-conteudo').innerHTML = htmlTabela;
            })
            .catch(erroScript => {
                document.getElementById('tabela-conteudo').innerHTML = `<div class="erro-alerta">❌ ${erroScript.message}</div>`;
            });
    </script>
</body>
</html>
