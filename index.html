<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investidor Assessoria Financeira</title>
    <!-- Vínculo com o seu arquivo CSS externo unificado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. TELA DE LOGIN / SENHA -->
    <div id="tela-senha">
        <div class="login-box">
            <h2>CONVIDADO!</h2>
            <p style="margin-bottom: 20px; color: #aaa;">Seja Bem Vindo!</p>
            <input type="password" id="input-senha" placeholder="Digite a senha de acesso" autofocus>
            <button onclick="verificarSenha()">Entrar</button>
            <div id="erro" class="erro-mensagem">Senha incorreta. Tente novamente.</div>
        </div>
    </div>

    <!-- 2. CONTEÚDO PRINCIPAL (MENU + SIDEBAR + FRAME DIREITO) -->
    <div id="conteudo-principal">
        
        <!-- Menu Horizontal Superior -->
        <nav>
            <div class="logo">AMBIENTE DO INVESTIDOR</div>
            <div class="menu-links">
                <button onclick="mudarCanais('ini_esquerdo.html', 'ini_direito.html')">Início</button>
                <button onclick="mudarCanais('curso/curso_esquerdo.html', 'curso/curso_direito.html')">Curso</button>
                <button onclick="mudarCanais('ativo/ativo_esquerdo.html', 'ativo/ativo_direito.html')">Ativo</button>
                <button onclick="mudarCanais('carteira/carteira_esquerdo.html', 'carteira/carteira_direito.html')">Carteira</button>
                <button onclick="efetuarLogout()" class="btn-sair">Sair ➔</button>
            </div>
        </nav>

<!-- Container Principal Atualizado -->
<div id="container-principal-frames" class="container-frames">
    
    <!-- SIDEBAR QUE ENVOLVE O FRAME ESQUERDO -->
    <div class="sidebar-wrapper">
        <!-- O NOVO BOTÃO HORIZONTAL: Idêntico ao padrão do menu superior -->
        <button onclick="alternarMenuEsquerdo()" class="btn-toggle-horizontal">
            <span class="seta-toggle">◀</span> Menu
        </button>
        
        <!-- Frame Esquerdo Interno -->
        <iframe id="frame-esquerdo" name="esquerdo" src="about:blank"></iframe>
    </div>
    
    <!-- Frame Direito (Conteúdo principal) -->
    <iframe id="frame-direito" name="direito" src="about:blank"></iframe>
</div>

<!-- Lógica do Menu Retrátil Lateral Atualizada -->
<script>
function alternarMenuEsquerdo() {
    const container = document.getElementById('container-principal-frames');
    const seta = document.querySelector('.seta-toggle');
    const botao = document.querySelector('.btn-toggle-horizontal');
    
    if (!container || !seta) return;

    container.classList.toggle('menu-escondido');
    
    // Inverte a setinha do botão e o texto conforme o estado
    if (container.classList.contains('menu-escondido')) {
        seta.innerHTML = "▶";
    } else {
        seta.innerHTML = "◀";
    }
}
</script>

    <!-- Vínculo com a sua folha de segurança e login externa -->
    <script src="js/login.js"></script>

</body>
</html>
