<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Navegação - Assessoria Financeira</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a; /* Fundo escuro idêntico ao modelo */
            color: #f8fafc;
            margin: 0;
            padding: 20px 15px;
            line-height: 1.4;
        }
        
        .titulo-menu {
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 25px;
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 2px solid #334155;
        }

        .titulo-menu:first-of-type {
            margin-top: 5px;
        }

        .menu-lista {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-item {
            margin-bottom: 8px;
        }

        /* Links de Navegação direcionando para o frame principal (target="frame-direito") */
        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Efeito de destaque ao passar o mouse */
        .menu-link:hover {
            background-color: #1e293b;
            color: #38bdf8; /* Muda para o Azul Destaque */
        }

        /* Item ativo (página atual onde o usuário está) */
        .menu-link.ativo {
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-weight: bold;
        }

        .icone {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* Badge numérico para notificações (ex: oportunidades de preço teto) */
        .badge-alerta-menu {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: bold;
            margin-left: auto; /* Empurra para o canto direito */
        }

        .badge-premium-menu {
            background-color: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <!-- Grupo 1: Visão Geral -->
    <div class="titulo-menu">Navegação Principal</div>
    <ul class="menu-lista">
        <li class="menu-item">
            <!-- Altere o "href" para o nome do arquivo da sua página de apresentação da direita -->
            <!-- O target="frame-direito" garante que a página abra dentro do painel da direita -->
            <a href="home_dashboard.html" target="frame-direito" class="menu-link ativo">
                <span class="icone">🏠</span> Início / Dashboard
            </a>
        </li>
    </ul>

    <!-- Grupo 2: Ferramentas -->
    <div class="titulo-menu">Ambiente do Investidor</div>
    <ul class="menu-lista">
        <li class="menu-item">
            <a href="carteira.html" target="frame-direito" class="menu-link">
                <span class="icone">📈</span> Minha Carteira
            </a>
        </li>

        <li class="menu-item">
            <a href="analise_quantitativa.html" target="frame-direito" class="menu-link">
                <span class="icone">📊</span> Dados & Gráficos
                <span class="badge-premium-menu">PRO</span>
            </a>
        </li>

        <li class="menu-item">
            <a href="preco_teto.html" target="frame-direito" class="menu-link">
                <span class="icone">🎯</span> Preço Teto Projetivo
                <span class="badge-alerta-menu">4</span>
            </a>
        </li>

    </ul>

    <!-- Grupo 3: Conhecimento -->
    <div class="titulo-menu">Educação</div>
    <ul class="menu-lista">
        <li class="menu-item">
            <a href="curso.html" target="frame-direito" class="menu-link">
                <span class="icone">🎓</span> Curso Investidor Pro
            </a>
        </li>
    </ul>

    <!-- Grupo 4: Configurações -->
    <div class="titulo-menu">Sua Conta</div>
    <ul class="menu-lista">
        <li class="menu-item">
            <a href="perfil.html" target="frame-direito" class="menu-link">
                <span class="icone">👤</span> Meu Perfil
            </a>
        </li>
        <li class="menu-item">
            <a href="logout.html" target="_top" class="menu-link" style="color: #f87171;">
                <span class="icone">🚪</span> Sair do Sistema
            </a>
        </li>
    </ul>

</body>
</html>
