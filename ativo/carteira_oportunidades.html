<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oportunidades e Simulador de Aportes</title>
    <!-- Vincula o mesmo CSS unificado do sistema -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="pagina-interna">

    <div class="container">
        <h1 class="titulo-pagina">Oportunidades de Investimento</h1>
        
        <div id="tabela-oportunidades-container" class="table-container tabela-oportunidades">
            <div class="status-msg">Processando base de dados operacional...</div>
        </div>
    </div>

    <!-- Estrutura do Popup para o ID 40 (Simulador) -->
    <div id="popup-simulador" class="modal-overlay" onclick="fecharModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="fecharModal(null)">&times;</button>
            <div id="modal-titulo" class="modal-header">Simulador do Ativo</div>
            <div id="modal-conteudo" class="simulador-grid">
                <!-- Preenchido via JS dinamicamente -->
            </div>
        </div>
    </div>

    <!-- Vincula o motor lógico externo da página -->
    <script src="/js/carteira_oportunidades.js"></script>
</body>
</html>
