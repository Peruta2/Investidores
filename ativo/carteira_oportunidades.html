<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oportunidades e Simulador de Aportes</title>
    <style>
        /* 1. PADRONIZAÇÃO DO CORPO (IDÊNTICO À GESTÃO) */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        
        .main-title {
            color: #38bdf8;
            font-size: 24px;
            margin: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 2. CONTAINER DE TABELA SÓLIDA (IDÊNTICO À GESTÃO) */
        .table-container {
            width: 100%;
            overflow-x: auto;
            background-color: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .db-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
            table-layout: fixed; /* Trava as colunas de forma rígida */
        }
        
        /* GABARITO DE DISTRIBUIÇÃO EXCLUSIVO PARA AS COLUNAS DE OPORTUNIDADE */
        .db-table th:nth-child(1), .db-table td:nth-child(1) { width: 15%; }
        .db-table th:nth-child(2), .db-table td:nth-child(2) { width: 10%; }
        .db-table th:nth-child(3), .db-table td:nth-child(3) { width: 10%; }
        .db-table th:nth-child(4), .db-table td:nth-child(4) { width: 11%; }
        .db-table th:nth-child(5), .db-table td:nth-child(5) { width: 10%; }
        .db-table th:nth-child(6), .db-table td:nth-child(6) { width: 11%; }
        .db-table th:nth-child(7), .db-table td:nth-child(7) { width: 11%; }
        .db-table th:nth-child(8), .db-table td:nth-child(8) { width: 12%; }
        .db-table th:nth-child(9), .db-table td:nth-child(9) { width: 10%; }
        .db-table th:nth-child(10), .db-table td:nth-child(10) { width: 5%; } /* Coluna compacta do botão vertical */
        
        .db-table td, .db-table th {
            padding: 8px 10px; /* Padding unificado e compacto de 8px 10px */
            text-align: left;
            position: relative;
        }
        
        /* 3. CORES E HOVERS DAS LINHAS (IDÊNTICO À GESTÃO) */
        .db-table td.linha-id0 {
            background-color: #1e293b !important;
            cursor: pointer;
            user-select: none;
        }
        
        .db-table tr.linha-id1-row td {
            background-color: #334155 !important;
            color: #ffffff !important;
            font-weight: bold !important;
            font-size: 13px !important;
        }
        
        .linha-dados td {
            border-bottom: none;
            color: #cbd5e1 !important;
            font-size: 13px;
            font-weight: normal;
        }
        
        .inicio-bloco-id td {
            border-top: 1px dotted #475569; /* Linha pontilhada padrão */
        }
        
        .db-table tr:hover {
            background-color: #24334d;
        }
        .db-table tr.linha-dados:hover td {
            color: #f8fafc !important;
        }
        .db-table tr.id0-row-clickable:hover td.linha-id0 {
            background-color: #24334d !important;
            color: #38bdf8 !important;
        }

        /* 4. SETA VISUAL DO ANIMAÇÃO DO COLAPSO (IDÊNTICO À GESTÃO) */
        .toggle-icon {
            display: inline-block;
            margin-right: 6px;
            color: #38bdf8;
            font-size: 11px;
            transition: transform 0.2s ease;
        }
        .collapsed .toggle-icon {
            transform: rotate(-90deg); /* Faz a seta virar para o lado quando fechada */
        }
        .row-hidden {
            display: none !important;
        }

        /* 5. DESIGN DO BOTÃO DE TRÊS PONTOS (⋮) */
        .btn-menu-lateral {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-menu-lateral:hover {
            color: #38bdf8;
            background-color: #334155;
        }

        /* 6. CORES E BORRÃO DE FUNDO DO POPUP (ID 40) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            z-index: 200;
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .modal-header {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 22px;
        }
        .modal-close:hover {
            color: #f87171;
        }
        
        .simulador-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .simulador-item {
            background-color: #0f172a;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .simulador-label {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .simulador-val {
            font-size: 13px;
            color: #ffffff;
            font-weight: 600;
        }

        .status-msg {
            padding: 30px;
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">Oportunidades de Investimento</h1>
        
        <!-- Recebe a injeção da tabela única contínua -->
        <div id="tabela-oportunidades-container" class="table-container">
            <div class="status-msg">Processando base de dados operacional...</div>
        </div>
    </div>

    <!-- Estrutura do Popup para o ID 40 (Simulador) -->
    <div id="popup-simulador" class="modal-overlay" onclick="fecharModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="fecharModal(null)">&times;</button>
            <div id="modal-titulo" class="modal-header">Simulador do Ativo</div>
            <div id="modal-conteudo" class="simulador-grid">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

<script>
    const memoriaSimulador = {};

    // LÓGICA DE ÁRVORE PADRONIZADA: Idêntica ao motor da tela de gestão
    window.alternarBloco = function(indexBloco) {
        const linhasFilhas = document.querySelectorAll(`.filhas-bloco-${indexBloco}`);
        const linhaMestre = document.getElementById(`mestre-bloco-${indexBloco}`);
        if (linhasFilhas.length === 0) return;

        // Uso do .item(0) contra o erro de corte de tokens do chat
        const primeiraLinha = linhasFilhas.item(0);
        let estaEscondido = primeiraLinha.classList.contains('row-hidden');

        linhasFilhas.forEach(linha => {
            if (estaEscondido) {
                linha.classList.remove('row-hidden');
            } else {
                linha.classList.add('row-hidden');
            }
        });

        if (linhaMestre) {
            if (estaEscondido) {
                linhaMestre.classList.remove('collapsed');
            } else {
                linhaMestre.classList.add('collapsed');
            }
        }
    };

    window.abrirSimulador = function(ativo) {
        const dadosDoAtivo = memoriaSimulador[ativo];
        const modal = document.getElementById('popup-simulador');
        if (!dadosDoAtivo) {
            alert(`Nenhum registro de simulador encontrado para o ativo ${ativo}.`);
            return;
        }

        document.getElementById('modal-titulo').innerText = `Simulador de Compra: ${ativo}`;
        let htmlPopup = '';
        dadosDoAtivo.valores.forEach((valor, index) => {
            let rotulo = dadosDoAtivo.titulos[index] || `Indicador ${index + 1}`;
            htmlPopup += `
                <div class="simulador-item">
                    <div class="simulador-label">${rotulo}</div>
                    <div class="simulador-val">${valor}</div>
                </div>`;
        });
        document.getElementById('modal-conteudo').innerHTML = htmlPopup;
        modal.classList.add('active');
    };

    window.fecharModal = function(e) {
        if (!e || e.target.id === 'popup-simulador' || e.type === 'click') {
            document.getElementById('popup-simulador').classList.remove('active');
        }
    };

    async function carregarOportunidades() {
        const container = document.getElementById('tabela-oportunidades-container');
        try {
            const resposta = await fetch('../csv/carteira_oportunidades.csv?v=' + Math.random());
            if (!resposta.ok) throw new Error('Não foi possível ler o arquivo CSV.');

            const buffer = await resposta.arrayBuffer();
            const decodificador = new TextDecoder('windows-1252');
            const lines = decodificador.decode(buffer).split('\n');

            let htmlTabela = '<table class="db-table">';
            let idEscopoAtual = 30, idAnterior = null, contadorBlocos = 0;
            let titulosId0 = null, titulosId1Op = null, titulosId1Sim = null;
            let valoresLinhaAnteriorOp = Array(9).fill('');
            let valoresLinhaAnteriorSim = Array(6).fill('');

            lines.forEach((linha) => {
                const htmlLinhaLimpa = linha.trim();
                if (htmlLinhaLimpa === '') return;

                // CORREÇÃO: Separando corretamente por ponto e vírgula para não quebrar a planilha
                const listaCampos = htmlLinhaLimpa.split(';').map(campo => campo.trim());
                const idRow = parseInt(listaCampos[0]);
                if (isNaN(idRow)) return;

                if (idRow === 30 || idRow === 40) {
                    idEscopoAtual = idRow;
                    idAnterior = null;
                    if (idRow === 40) { titulosId0 = null; titulosId1Op = null; }
                    return;
                }

                if (idEscopoAtual === 30) {
                    let dadosOp = listaCampos.slice(1, 10);
                    while (dadosOp.length < 9) dadosOp.push('');

                    let classeSeparadoraID = '';
                    if (idAnterior !== null && idRow !== idAnterior && (idRow === 0 || idRow === 1)) {
                        classeSeparadoraID = 'inicio-bloco-id';
                    }

                    // CORREÇÃO ESSENCIAL: Acessando a primeira gaveta [0] antes de aplicar o toUpperCase()
                    if (idRow === 0 && dadosOp[0] && dadosOp[0].toUpperCase().includes('ANÁLISE')) {
                        titulosId0 = [...dadosOp];
                        return;
                    } else if (idRow === 0) {
                        contadorBlocos++;
                    }

                    idAnterior = idRow;

                    let classeLinhaTr = classeSeparadoraID;
                    if (idRow === 1) classeLinhaTr += ` linha-id1-row filhas-bloco-${contadorBlocos} row-hidden`;
                    else if (idRow >= 2) classeLinhaTr += ` linha-dados filhas-bloco-${contadorBlocos} row-hidden`;

                    let htmlLinhaStr = '';

                    if (idRow === 0) {
                        if (titulosId0 === null) titulosId0 = ["Ativos", "", "Situação Atual", "", "", "", "", "Valuation", ""];
                        htmlLinhaStr += `<tr id="mestre-bloco-${contadorBlocos}" class="id0-row-clickable collapsed ${classeSeparadoraID}" onclick="alternarBloco(${contadorBlocos})">`;
                        dadosOp.forEach((conteudo, colIndex) => {
                            let titulo = titulosId0[colIndex] || '';
                            let prefixoIcone = colIndex === 0 ? `<span class="toggle-icon">▼</span>` : '';
                            htmlLinhaStr += `<td class="linha-id0">
                                <div style="font-size: 10px; color: #94a3b8; font-weight: normal; margin-bottom: 2px;">${titulo}</div>
                                <div style="font-size: 13px; color: #38bdf8; font-weight: bold; display: flex; align-items: center;">${prefixoIcone}${conteudo}</div>
                            </td>`;
                        });
                        htmlLinhaStr += '<td class="linha-id0"></td></tr>';
                        titulosId0 = null;
                    } 
                    else if (idRow === 1) {
                        titulosId1Op = [...dadosOp];
                        htmlLinhaStr += `<tr class="${classeLinhaTr.trim()}">`;
                        titulosId1Op.forEach(campo => htmlLinhaStr += `<td>${campo}</td>`);
                        htmlLinhaStr += '<td></td></tr>';
                    } 
                    else if (idRow === 2) {
                        const ticker = dadosOp[0];
                        if (!ticker) return;

                        for (let i = 0; i < dadosOp.length; i++) {
                            if (dadosOp[i] === '' && valoresLinhaAnteriorOp[i]) dadosOp[i] = valoresLinhaAnteriorOp[i];
                        }
                        valoresLinhaAnteriorOp = [...dadosOp];

                        htmlLinhaStr += `<tr class="${classeLinhaTr.trim()}">`;
                        dadosOp.forEach(valor => htmlLinhaStr += `<td>${valor}</td>`);
                        htmlLinhaStr += `<td><button class="btn-menu-lateral" onclick="abrirSimulador('${ticker}')">&#8942;</button></td></tr>`;
                    }
                    htmlTabela += htmlLinhaStr;
                }
                else if (idEscopoAtual === 40) {
                    let dadosSim = listaCampos.slice(1, 7);
                    while (dadosSim.length < 6) dadosSim.push('');

                    if (idRow === 1) {
                        titulosId1Sim = [...dadosSim];
                    } 
                    else if (idRow === 2) {
                        const ticker = dadosSim[0];
                        if (!ticker) return;

                        for (let i = 0; i < dadosSim.length; i++) {
                            if (dadosSim[i] === '' && valoresLinhaAnteriorSim[i]) dadosSim[i] = valoresLinhaAnteriorSim[i];
                        }
                        valoresLinhaAnteriorSim = [...dadosSim];

                        memoriaSimulador[ticker] = {
                            titulos: titulosId1Sim ? titulosId1Sim.slice(1) : ["Ordem", "Investimento", "Preço Médio", "Variação", "Upside"],
                            valores: dadosSim.slice(1)
                        };
                    }
                }
            });

            htmlTabela += '</table>';
            container.innerHTML = htmlTabela;
        } catch (erro) {
            container.innerHTML = `<div class="status-msg" style="color: #f87171;">Erro: ${erro.message}</div>`;
        }
    }
    window.onload = carregarOportunidades;
</script>

</head>
</html>
