<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Abas (Tabs) com CSV</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h2 {
            color: #e2e8f0;
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Tabela Estilo Base de Dados */
        .table-container {
            width: 100%;
            overflow-x: auto;
            background-color: #1e293b;
            border-radius: 0 0 8px 8px; /* Arredonda apenas os cantos inferiores para encaixar na aba */
            border: 1px solid #334155;
            margin-bottom: 30px;
        }
        .db-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }
        .db-table th {
            background-color: #334155;
            color: #cbd5e1;
            padding: 12px 10px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .db-table td {
            padding: 10px;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
        }
        .db-table tr:hover {
            background-color: #24334d;
        }
        
        /* Badges de Status Conforme o Modelo */
        .badge-pos {
            background-color: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .badge-neg {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .badge-info {
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .badge-wait {
            background-color: rgba(234, 88, 12, 0.1);
            color: #f97316;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(234, 88, 12, 0.2);
        }
        
        .status-msg {
            padding: 20px;
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }

        /* NOVOS ESTILOS: Customização das Abas para o Modo Escuro */
        .tab-buttons {
            display: flex;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
            max-width: 300px; /* Limita a largura dos botões das guias */
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tab-btn:hover {
            background-color: #24334d;
            color: #f8fafc;
        }
        .tab-btn.active {
            background-color: #334155;
            color: #38bdf8; /* Azul destacado igual ao H1 */
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        /* Classe utilitária para centralizar dados das tabelas */
        .txt-centro {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Abas -->
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="mudarAba(event, 'aba-desejado')">Desejado</button>
        <button class="tab-btn" onclick="mudarAba(event, 'aba-realidade')">Realidade</button>
    </div>

    <!-- Os containers ganharam a classe .table-container que você enviou -->
    <div id="aba-desejado" class="tab-content active">
        <div id="tabela-desejado" class="table-container">Carregando planejamento desejado...</div>
    </div>

    <div id="aba-realidade" class="tab-content">
        <div id="tabela-realidade" class="table-container">Carregando realidade da carteira...</div>
    </div>
</div>

    <script>
        // Função para alternar entre as abas
        function mudarAba(evento, idAba) {
            const conteudos = document.querySelectorAll('.tab-content');
            conteudos.forEach(conteudo => conteudo.classList.remove('active'));

            const botoes = document.querySelectorAll('.tab-btn');
            botoes.forEach(botao => botao.classList.remove('active'));

            document.getElementById(idAba).classList.add('active');
            evento.currentTarget.classList.add('active');
        }

        // Função que lê o CSV e monta a tabela HTML
async function carregarCSV() {
    const containerDesejado = document.getElementById('tabela-desejado');
    const containerRealidade = document.getElementById('tabela-realidade');
    
    try {
        const resposta = await fetch('../csv/carteira_plan.csv');
        
        if (!resposta.ok) {
            throw new Error('Não foi possível carregar o arquivo CSV.');
        }

        const texto = await resposta.text();
        const linhas = texto.split('\n');

        // Agora iniciamos a tabela aplicando a sua nova classe profissional
        let htmlDesejado = '<table class="db-table">';
        let htmlRealidade = '<table class="db-table">';
        
        let blocoAtual = ''; 
        let primeiroDadoDesejado = false;
        let primeiroDadoRealidade = false;

        linhas.forEach((linha) => {
            const linhaLimpa = linha.trim(); // corrigido para ler a linha atual
            if (linhaLimpa === '') return;

            const colunas = linha.split(';');
            
            const valoresPreenchidos = colunas.filter(c => c.trim() !== '');
            if (valoresPreenchidos.length === 0) {
                // Linhas vazias ganham uma tr sutil adaptada ao layout
                const trVazia = '<tr style="height: 15px;"><td colspan="10" style="border: none;"></td></tr>';
                if (blocoAtual === 'DESEJADO') htmlDesejado += trVazia;
                if (blocoAtual === 'REALIDADE') htmlRealidade += trVazia;
                return;
            }

            if (linhaLimpa.toUpperCase().includes('DESEJADO')) {
                blocoAtual = 'DESEJADO';
                primeiroDadoDesejado = true;
            }
            else if (linhaLimpa.toUpperCase().includes('REALIDADE')) {
                blocoAtual = 'REALIDADE';
                primeiroDadoRealidade = true;
            }

            const ehRenda = linhaLimpa.toUpperCase().includes('RENDA');
            let htmlLinha = '<tr>';
            
            let ultimoIndicePreenchido = -1;
            for (let i = colunas.length - 1; i >= 0; i--) {
                if (colunas[i].trim() !== '') {
                    ultimoIndicePreenchido = i;
                    break;
                }
            }

            colunas.forEach((coluna, colIndex) => {
                const valor = coluna.trim();
                
                if (ehRenda) {
                    // Título da seção (RENDA) - Primeira coluna esquerda, demais no centro
                    const classeAlinhamento = colIndex === 0 ? '' : 'class="txt-centro"';
                    htmlLinha += `<th ${classeAlinhamento}>${valor}</th>`;
                } else {
                    // Linhas comuns de dados
                    // Primeira coluna mantém o padrão (esquerda) e as outras usam a classe txt-centro
                    let classeCelula = colIndex === 0 ? '' : 'class="txt-centro"';
                    let conteudoExibir = valor;
                    
                    // Se for o valor total da primeira linha, envolvemos ele no seu badge de status (.badge-info)
                    if ((blocoAtual === 'DESEJADO' && primeiroDadoDesejado && colIndex === ultimoIndicePreenchido) ||
                        (blocoAtual === 'REALIDADE' && primeiroDadoRealidade && colIndex === ultimoIndicePreenchido)) {
                        conteudoExibir = `<span class="badge-info" style="font-weight: 600; font-size: 14px;">${valor}</span>`;
                    }
                    
                    htmlLinha += `<td ${classeCelula}>${conteudoExibir}</td>`;
                }
            });

            htmlLinha += '</tr>';

            if (blocoAtual === 'DESEJADO') {
                htmlDesejado += htmlLinha;
                if (primeiroDadoDesejado && !linhaLimpa.toUpperCase().includes('DESEJADO')) {
                    primeiroDadoDesejado = false;
                }
            } else if (blocoAtual === 'REALIDADE') {
                htmlRealidade += htmlLinha;
                if (primeiroDadoRealidade && !linhaLimpa.toUpperCase().includes('REALIDADE')) {
                    primeiroDadoRealidade = false;
                }
            }
        });

        htmlDesejado += '</table>';
        htmlRealidade += '</table>';

        containerDesejado.innerHTML = htmlDesejado;
        containerRealidade.innerHTML = htmlRealidade;

    } catch (erro) {
        containerDesejado.innerHTML = `<div class="status-msg" style="color: #f87171;">Erro ao carregar os dados: ${erro.message}</div>`;
        containerRealidade.innerHTML = `<div class="status-msg" style="color: #f87171;">Erro ao carregar os dados: ${erro.message}</div>`;
    }
}

        // Executa a leitura do CSV assim que a página termina de carregar
        window.onload = carregarCSV;
    </script>

</body>
</html>
