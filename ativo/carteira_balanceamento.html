<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento e Balanceamento - Minha Carteira</title>
    <!-- Estilos Globais Unificados -->
    <link rel="stylesheet" href="../css/carteira.css">
    <!-- Chamada Local Oficial Compilada (UMD) com Escrita Corrigida -->
    <script src="../js/chart.js"></script>
    <style>
        body {
            background-color: var(--azul-marinho);
            margin: 0;
            padding: 30px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--branco);
        }
        .header-modulo h1 {
            color: var(--laranja-claro-dourado);
            margin: 0 0 25px 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(229, 196, 149, 0.2);
            padding-bottom: 10px;
        }
        /* Dashboard Layout: Grid Rígido de 4 Colunas no Topo */
        .kpi-cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 15px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background-color: var(--azul-escuro-tab);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--laranja-claro-dourado);
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .kpi-card .card-titulo {
            font-size: 11px;
            color: var(--cinza-claro-azulado);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .kpi-card .card-valor {
            font-size: 22px;
            font-weight: bold;
            color: var(--branco);
        }
        .kpi-card .card-sub {
            font-size: 12px;
            color: var(--azul-claro-brilhoso);
            margin-top: 4px;
            font-weight: 600;
        }
        
        /* O Quarto Bloco é o Card que abriga o Gráfico + Legenda em Flex Horizontal */
        .chart-box-card {
            background-color: var(--azul-escuro-tab);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: space-between; /* Gráfico na esquerda, legenda na direita */
            gap: 15px;
            height: 100%;
            min-height: 110px;
            border-left: 4px solid var(--azul-claro-brilhoso);
            box-sizing: border-box;
        }
        
        /* Contêiner da Legenda Customizada Premium */
        .chart-legenda-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            justify-content: center;
        }
        .legenda-item {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Nome na esquerda, % na direita */
            font-size: 11px;
            color: var(--branco);
            font-weight: 600;
        }
        .legenda-classe-flex {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--cinza-claro-azulado);
            font-weight: normal;
        }
        .legenda-cor-quadrado {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        
        /* Seções de Tabelas Contínuas */
        .secao-tabela-bloco {
            margin-bottom: 35px;
            background-color: var(--azul-escuro-tab);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .secao-titulo {
            font-size: 14px;
            font-weight: bold;
            color: var(--laranja-claro-dourado);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-msg {
            padding: 30px;
            text-align: center;
            color: var(--cinza-claro-azulado);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-modulo">
        <h1>Módulo 1: Planejamento & Balanceamento</h1>
    </div>

    <!-- PAINEL EXECUTIVO UNIFICADO: 3 KPI CARDS + 1 CARD GRÁFICO (id60 / id10) -->
    <div id="kpi-cards-container" class="kpi-cards-grid">
        <div class="status-msg">Carregando indicadores e painel gráfico...</div>
    </div>

    <!-- MACRO: BALANCEMENTO POR CLASSES DE ATIVOS (id10) -->
    <div class="secao-tabela-bloco">
        <div class="secao-titulo">➔ Balanceamento por Classes de Ativos</div>
        <div class="table-container" id="container-id10-tabela">
            <div class="status-msg">Processando matrizes estruturais de classes...</div>
        </div>
    </div>

    <!-- MICRO: BALANCEAMENTO DOS ATIVOS INDIVIDUAIS (id30) -->
    <div class="secao-tabela-bloco">
        <div class="secao-titulo">➔ Detalhamento de Alocação dos Ativos</div>
        <div class="table-container" id="container-id30-tabela">
            <div class="status-msg">Processando alocações granulares por ticker...</div>
        </div>
    </div>

    <!-- Cérebro Lógico Otimizado Versão 3 -->
    <script src="../js/carteira_balanceamento.js"></script>
</body>
</html>
