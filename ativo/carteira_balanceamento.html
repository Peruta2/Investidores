<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento de Carteira</title>
    <!-- Vincula o mesmo CSS unificado -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-interna">

    <div class="container">
        <!-- Correção: Adicionada a classe correta para o título herdar a identidade do sistema -->
        <h1 class="titulo-pagina">Balanceamento da Carteira</h1>

        <!-- Abas -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="mudarAba(event, 'aba-desejado')">Desejado</button>
            <button class="tab-btn" onclick="mudarAba(event, 'aba-realidade')">Realidade</button>
        </div>
        <div class="tab-buttons-spacer"></div>

        <!-- Tabelas das Abas -->
        <div id="aba-desejado" class="tab-content active">
            <div id="tabela-desejado" class="table-container">
                <div class="status-msg">Processando dados planejados...</div>
            </div>
        </div>

        <div id="aba-realidade" class="tab-content">
            <div id="tabela-realidade" class="table-container">
                <div class="status-msg">Processando dados reais...</div>
            </div>
        </div>
    </div>

    <!-- Chamada atualizada com o novo nome do arquivo unificado -->
    <script src="../js/carteira_balanceamento.js"></script>

</body>
</html>
