<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento de Carteira</title>
	<style>
	    body {
	        font-family: 'Segoe UI', Roboto, sans-serif;
	        background-color: #0f172a;
	        color: #f8fafc;
	        margin: 0;
	        padding: 30px;
	        line-height: 1.6;
	    }
	    .container {
	        max-width: 1300px;
	        margin: 0 auto;
	    }
            h1 {
                color: #38bdf8;
                font-size: 24px;
                margin: 0;
                border-bottom: 1px solid #334155;
                padding-bottom: 15px;
                margin-bottom: 20px;
            }
            h2 {
                color: #e2e8f0;
                font-size: 18px;
                margin-top: 30px;
                margin-bottom: 15px;
                font-weight: 600;
            }
            p {
                color: #94a3b8;
                font-size: 14px;
                margin-bottom: 20px;
            }
 
	    /* Guias / Abas Estilo Ficheiro */
	    .tab-buttons {
	        display: flex;
	        background-color: #1e293b;
	        border: 1px solid #334155;
	        border-bottom: none;
	        border-radius: 8px 8px 0 0;
	        overflow: hidden;
	        max-width: 300px;
	    }
	    .tab-btn {
	        flex: 1;
	        padding: 12px;
	        border: none;
	        background: none;
	        cursor: pointer;
	        font-size: 13px;
	        font-weight: 600;
	        color: #94a3b8;
	        transition: 0.2s;
	        text-transform: uppercase;
	        letter-spacing: 0.5px;
	    }
	    .tab-btn:hover {
	        background-color: #24334d;
	        color: #f8fafc;
	    }
	    .tab-btn.active {
	        background-color: #334155;
	        color: #38bdf8;
	    }
	    .tab-buttons-spacer {
	        height: 1px;
	        background-color: #334155;
	        margin-top: -1px;
	    }
	    .tab-content {
	        display: none;
	    }
	    .tab-content.active {
	        display: block;
	    }

	    /* Container do Fundo da Planilha */
	    .table-container {
	        width: 100%;
	        overflow-x: auto;
	        background-color: #1e293b;
	        border-radius: 0 8px 8px 8px;
	        border: 1px solid #334155;
	        margin-bottom: 30px;
	        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
	    }
    
	    .db-table {
	        width: 100%;
	        border-collapse: collapse;
	        text-align: left;
	        font-size: 13px;
	        table-layout: fixed;
	    }
    
	    /* Distribuição rígida proporcional das 6 colunas visíveis (Gabarito do Perfil) */
	    .db-table th:nth-child(1), .db-table td:nth-child(1) { width: 24%; }
	    .db-table th:nth-child(2), .db-table td:nth-child(2) { width: 18%; }
	    .db-table th:nth-child(3), .db-table td:nth-child(3) { width: 11%; }
	    .db-table th:nth-child(4), .db-table td:nth-child(4) { width: 11%; }
	    .db-table th:nth-child(5), .db-table td:nth-child(5) { width: 18%; }
	    .db-table th:nth-child(6), .db-table td:nth-child(6) { width: 18%; }
    
	    .db-table td, .db-table th {
	        padding: 8px 10px; /* Padding unificado compacto */
	    }
    
	    /* Estilização baseada nos Níveis de ID */
	    .linha-id0 td {
	        background-color: #111827;
	        font-weight: 600;
	    }
    
	    /* Regra da Guia Ativa Fixa para o Submenu (ID 1) */
	    .db-table tr.linha-id1-row td {
	        background-color: #334155 !important;
	        color: #ffffff !important;
	        font-weight: bold !important;
	        font-size: 13px !important;
	    }
    
	    /* Linhas do Ativo (ID >= 2) */
	    .linha-dados td {
		border-bottom: none;
		color: #cbd5e1 !important;                      	/* 1. COR DA FONTE */
	        font-size: 13px !important;                             /* 3. TAMANHO DA FONTE */
	        font-weight: normal !important;                         /* 4. PESO DA FONTE (Normal/Sem Negrito) */
	    }
    
	    /* Tracejado sutil apenas no início de cada bloco diferente */
	    .inicio-bloco-id td {
	        border-top: 1px dotted #475569;
	    }
    
	    .db-table tr:hover {
	        background-color: #24334d;
	    }
    
	    .db-table tr.linha-dados:hover td {
	        color: #f8fafc !important;
	    }
    
	    /* Trava o hover nas linhas do Submenu (ID 1) */
	    .db-table tr.linha-id1-row:hover,
	    .db-table tr.linha-id1-row:hover td {
	        background-color: #334155 !important;
	        color: #ffffff !important;
	    }
    
	    .txt-centro { text-align: center; }
	    .txt-direita { text-align: right; }
    
	    .status-msg {
	        padding: 30px;
	        text-align: center;
	        color: #94a3b8;
	        font-style: italic;
	    }

	</style>
</head>
<body>

    <div class="container">
    <h1>Balanceamento da Carteira</h1>

        <!-- Abas -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="mudarAba(event, 'aba-desejado')">Desejado</button>
            <button class="tab-btn" onclick="mudarAba(event, 'aba-realidade')">Realidade</button>
        </div>
        <div class="tab-buttons-spacer"></div>

        <!-- Tabelas das Abas -->
        <div id="aba-desejado" class="tab-content active">
            <div id="tabela-desejado" class="table-container">
                <div class="status-msg">Processando dados planejados...</div>
            </div>
        </div>

        <div id="aba-realidade" class="tab-content">
            <div id="tabela-realidade" class="table-container">
                <div class="status-msg">Processando dados reais...</div>
            </div>
        </div>
    </div>

<script>
    // Função para alternar visualmente entre as guias
    function mudarAba(evento, idAba) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(idAba).classList.add('active');
        evento.currentTarget.classList.add('active');
    }

    async function carregarCarteiraPerfil() {
        const containerDesejado = document.getElementById('tabela-desejado');
        const containerRealidade = document.getElementById('tabela-realidade');
        
        try {
            const resposta = await fetch('../csv/carteira_balanceamento.csv?v=' + Math.random());
            if (!resposta.ok) throw new Error('Não foi possível ler o arquivo carteira_balanceamento.csv.');

            const buffer = await resposta.arrayBuffer();
            const decodificador = new TextDecoder('windows-1252');
            const texto = decodificador.decode(buffer);
            const lines = texto.split('\n');

            let htmlDesejado = '<table class="db-table">';
            let htmlRealidade = '<table class="db-table">';
            
            let blocoDestino = ''; 
            let idAnterior = null;
            
            let valoresLinhaAnterior = Array(6).fill('');
            
            let titulosId0Temporario = null;
            let titulosId1Temporario = null;
            
            let proximaLinhaEhConteudoId1 = false;

            lines.forEach((linha) => {
                const linhaLimpa = linha.trim();
                if (linhaLimpa === '') return;

                const colunas = linha.split(';').slice(0, 7);
                while(colunas.length < 7) colunas.push('');

                // CORREÇÃO DEFINITIVA: Acessando explicitamente a primeira gaveta da lista antes do trim
                const idRow = parseInt(colunas[0].trim());
                if (isNaN(idRow)) return;

                let dadosVisiveis = colunas.slice(1, 7).map(c => c.trim());

                if (idRow === 0 && dadosVisiveis[0].toUpperCase() === 'DESEJADO') {
                    blocoDestino = 'DESEJADO';
                } else if (idRow === 0 && dadosVisiveis[0].toUpperCase() === 'REALIDADE') {
                    htmlDesejado += '</table>'; 
                    blocoDestino = 'REALIDADE';
                    idAnterior = null;
                    valoresLinhaAnterior = Array(6).fill('');
                    titulosId0Temporario = null;
                    titulosId1Temporario = null;
                    proximaLinhaEhConteudoId1 = false;
                }

                let classeSeparadoraID = '';
                if (idAnterior !== null && idRow !== idAnterior) {
                    if (idRow === 0 || idRow === 1) {
                        classeSeparadoraID = 'inicio-bloco-id';
                    }
                }
                idAnterior = idRow;

                let classeLinhaTr = classeSeparadoraID;
                if (idRow === 1) {
                    classeLinhaTr += ' linha-id1-row';
                } else if (idRow >= 2) {
                    classeLinhaTr += ' linha-dados'; 
                }

                if (idRow === 0) {
                    if (dadosVisiveis[0].toUpperCase() === 'CARTEIRA') {
                        titulosId0Temporario = [...dadosVisiveis];
                        return; 
                    }
                } else if (idRow === 1) {
                    if (dadosVisiveis[0].toUpperCase() === 'ATIVOS') {
                        titulosId1Temporario = [...dadosVisiveis];
                        proximaLinhaEhConteudoId1 = false;
                        return;
                    }
                }

                let htmlLinha = `<tr class="${classeLinhaTr.trim()}">`;

                if (idRow === 0) {
                    if (titulosId0Temporario === null) {
                        titulosId0Temporario = ["Carteira", "Perfil de Investimento", "", "", "Patrimônio Total", ""];
                    }

                    dadosVisiveis.forEach((conteudo, colIndex) => {
                        let titulo = titulosId0Temporario[colIndex] || '';
                        let classeAlinhamento = colIndex === 0 ? '' : 'class="txt-centro"';
                        if (conteudo.includes('R$')) classeAlinhamento = 'class="txt-direita"';

                        htmlLinha += `<td class="linha-id0" ${classeAlinhamento}>
                            <div style="font-size: 10px; color: #94a3b8; font-weight: normal; margin-bottom: 2px;">${titulo}</div>
                            <div style="font-size: 13px; color: #38bdf8; font-weight: bold;">${conteudo}</div>
                        </td>`;
                    });
                } 
                else if (idRow === 1) {
                    if (titulosId1Temporario === null) {
                        titulosId1Temporario = ["Ativos", "Perfil Carteira", "% ativos", "% carteira", "Patrimônio Renda Fixa", ""];
                    }

                    let estiloTextoLinha2 = proximaLinhaEhConteudoId1 
                        ? 'color: #ffffff !important; font-weight: bold !important; font-size: 13px !important;' 
                        : '';

                    dadosVisiveis.forEach((conteudo, colIndex) => {
                        let titulo = titulosId1Temporario[colIndex] || '';
                        let classeAlinhamento = colIndex === 0 ? '' : 'class="txt-centro"';
                        if (conteudo.includes('R$')) classeAlinhamento = 'class="txt-direita"';

                        let estiloRecuo = colIndex === 0 ? 'style="padding-left: 15px; border-left: 3px solid #475569;"' : '';

                        htmlLinha += `<td class="linha-id1" ${classeAlinhamento} ${estiloRecuo}>
                            <div style="font-size: 10px; color: #94a3b8; font-weight: normal; margin-bottom: 2px;">${titulo}</div>
                            <div style="${estiloTextoLinha2}">${conteudo}</div>
                        </td>`;
                    });
                    
                    proximaLinhaEhConteudoId1 = true;
                } 
                else {
                    let camposEramVazios = Array(6).fill(false);

                    for (let i = 0; i < dadosVisiveis.length; i++) {
                        if (dadosVisiveis[i] === '') {
                            camposEramVazios[i] = true;
                            if (valoresLinhaAnterior[i] !== '') {
                                dadosVisiveis[i] = valoresLinhaAnterior[i];
                            }
                        }
                    }
                    valoresLinhaAnterior = [...dadosVisiveis];

                    dadosVisiveis.forEach((valorCampo, colIndex) => {
                        let classeAlinhamento = 'class="txt-centro"';
                        if (colIndex === 0) classeAlinhamento = ''; 
                        if (valorCampo.includes('R$')) classeAlinhamento = 'class="txt-direita"'; 

                        let estiloSuave = colIndex === 0 ? 'style="padding-left: 28px; border-left: 3px solid #334155;' : 'style="';
                        
                        if (camposEramVazios[colIndex]) {
                            estiloSuave += ' opacity: 0.20; font-style: italic;';
                        }
                        estiloSuave += '"';

                        htmlLinha += `<td class="linha-dados" ${classeAlinhamento} ${estiloSuave}>${valorCampo}</td>`;
                    });
                }

                htmlLinha += '</tr>';

                if (blocoDestino === 'DESEJADO') htmlDesejado += htmlLinha;
                if (blocoDestino === 'REALIDADE') htmlRealidade += htmlLinha;
            });

            htmlRealidade += '</table>';

            containerDesejado.innerHTML = htmlDesejado;
            containerRealidade.innerHTML = htmlRealidade;

        } catch (erro) {
            const painelErro = `<div class="status-msg" style="color: #f87171;">Erro de carga: ${erro.message}</div>`;
            containerDesejado.innerHTML = painelErro;
            containerRealidade.innerHTML = painelErro;
        }
    }

    window.onload = carregarCarteiraPerfil;
</script>

</body>
</html>
