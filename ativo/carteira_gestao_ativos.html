<!DOCTYPE html>
<html lang="pt-BR">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Operacional de Carteira</title>
    <!-- Vincula o mesmo CSS unificado do sistema -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-interna">

    <div class="container">
        <!-- Correção: Classe adicionada para usar a identidade visual correta -->
        <h1 class="titulo-pagina">Gestão de Ativos da Carteira</h1>
        
        <!-- Abas -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="mudarAba(event, 'aba-desejado')">Desejado</button>
            <button class="tab-btn" onclick="mudarAba(event, 'aba-realidade')">Realidade</button>
        </div>
        <div class="tab-buttons-spacer"></div>

        <!-- Conteúdos das Abas (Recebem as tabelas injetadas separadamente) -->
        <!-- Otimização: Removidos os styles inline 'margin-top' pois o CSS externo já gerencia os espaçamentos -->
        <div id="aba-desejado" class="tab-content active">
            <div id="tabela-desejado" class="table-container">
                <div class="status-msg">Processando dados planejados...</div>
            </div>
        </div>

        <div id="aba-realidade" class="tab-content">
            <div id="tabela-realidade" class="table-container">
                <div class="status-msg">Processando dados reais...</div>
            </div>
        </div>
    </div>

    <!-- Chame o arquivo externo de gestão unificado -->
    <script src="../js/carteira_gestao.js"></script>

</body>
</html>
