<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Superior Ativo</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a; /* Fundo escuro idêntico ao modelo */
            color: #f8fafc;
            margin: 0;
            padding: 20px 15px;
            line-height: 1.4;
        }
        
        .titulo-menu {
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 25px;
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 2px solid #334155;
        }

        .titulo-menu:first-of-type {
            margin-top: 5px;
        }

        .menu-lista {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-item {
            margin-bottom: 6px;
        }

        /* Links e Botões de Navegação unificados (Mantendo o target="direito") */
        .btn-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            transition: background-color 0.2s, color 0.2s;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            box-sizing: border-box;
            font-family: inherit;
        }

        /* Efeito de destaque ao passar o mouse */
        .btn-menu:hover {
            background-color: #1e293b;
            color: #38bdf8; /* Muda para o Azul Destaque */
        }

        /* Variação para os sub-itens do Dropdown */
        .sub-item {
            padding-left: 32px;
            font-size: 13px;
            color: #94a3b8;
        }

        /* Estrutura Oculta do Dropdown por padrão */
        .dropdown-conteudo {
            list-style: none;
            padding: 0;
            margin: 0;
            display: none; /* Esconde os sub-itens */
        }

        /* Classe utilitária via JavaScript para exibir o dropdown */
        .dropdown-conteudo.aberto {
            display: block;
        }

        /* Controle visual da Seta do Dropdown */
        .seta {
            margin-left: auto;
            font-size: 10px;
            transition: transform 0.2s;
            color: #64748b;
        }

        .seta.rodada {
            transform: rotate(180deg);
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Grupo 1: Dados Financeiros dos Ativos -->
    <div class="titulo-menu">Dados Financeiros</div>
    <ul class="menu-lista">
        <!-- Estrutura do Dropdown Ações (Atualizado) -->
        <li class="menu-item">
            <button class="btn-menu btn-expandivel" id="btnDropdownAcoes">
                <span class="icone">📊</span>
                <span class="texto-menu">Ações</span>
                <span class="seta" id="setaAcoes">▼</span>
            </button>
            <ul class="dropdown-conteudo" id="conteudoAcoes">
                <li>
                    <a class="btn-menu sub-item" href="acao_bbdc4.html" target="direito">
                        <span class="icone">📊</span>
                        <span class="texto-menu">BBDC4</span>
                    </a>
                </li>
                <li>
                    <a class="btn-menu sub-item" href="acao_itub4.html" target="direito">
                        <span class="icone">📊</span>
                        <span class="texto-menu">ITUB4</span>
                    </a>
                </li>
            </ul>
        </li>
        
        <!-- Estrutura do Dropdown Corporativa -->
        <li class="menu-item">
            <button class="btn-menu btn-expandivel" id="btnDropdownFii">
                <span class="icone">🏛️</span>
                <span class="texto-menu">Fundos Imobiliários</span>
                <span class="seta" id="setaFii">▼</span>
            </button>
            <ul class="dropdown-conteudo" id="conteudoFii">
                <li>
                    <a class="btn-menu sub-item" href="fii_hglg11.html" target="direito">
                        <span class="icone">📊</span>
                        <span class="texto-menu">HGLG11</span>
                    </a>
                </li>
                <li>
                    <a class="btn-menu sub-item" href="fii_btlg11.html" target="direito">
                        <span class="icone">📊</span>
                        <span class="texto-menu">BTLG11</span>
                    </a>
                </li>
            </ul>
        </li>

        <li class="menu-item">
            <a class="btn-menu" href="ativo_direito.html" target="direito">
                <span class="icone">📊</span>
                <span class="texto-menu">Renda Fixa</span>
            </a>
        </li>
        <li class="menu-item">
            <a class="btn-menu" href="ativo_direito.html" target="direito">
                <span class="icone">📊</span>
                <span class="texto-menu">Dolarização</span>
            </a>
        </li>
    </ul>

    <!-- Grupo 2: Planejamento da Carteira -->
    <div class="titulo-menu">Planejamento da Carteira</div>
    <ul class="menu-lista">
        <li class="menu-item">
            <a class="btn-menu" href="carteira_balanceamento.html" target="direito">
                <span class="icone">🛡️</span>
                <span class="texto-menu">Balanceamento da Carteira</span>
            </a>
        </li>
        <li class="menu-item">
            <a class="btn-menu" href="carteira_gestao_ativos.html" target="direito">
                <span class="icone">🛡️</span>
                <span class="texto-menu">Gestao de Ativos da Carteira</span>
            </a>
        </li>
        <li class="menu-item">
            <a class="menu-link btn-menu" href="carteira_oportunidades.html" target="direito">
                <span class="icone">🛡️</span>
                <span class="texto-menu">Encontrando Oportunidade</span>
            </a>
        </li>
    </ul>

    <!-- Grupo 3: Carteira do Investidor -->
    <div class="titulo-menu">Ambiente de Teste</div>
    <ul class="menu-lista">
        <li class="menu-item">
            <a class="btn-menu" href="csv_teste.html" target="direito">
                <span class="icone">🛡️</span>
                <span class="texto-menu">Leitura Arquivo CVS</span>
            </a>
        </li>
        <li class="menu-item">
            <a class="menu-link btn-menu" href="ativo_direito.html" target="direito">
                <span class="icone">🛡️</span>
                <span class="texto-menu">Teste 2</span>
            </a>
        </li>
    </ul>

    <!-- Lógica JavaScript para funcionamento do Dropdown -->
    <script>
        function configurarDropdown(idBotao, idConteudo, idSeta) {
            var botao = document.getElementById(idBotao);
            if (botao) {
                botao.addEventListener('click', function(e) {
                    var conteudo = document.getElementById(idConteudo);
                    var seta = document.getElementById(idSeta);
                    
                    if (conteudo) conteudo.classList.toggle('aberto');
                    if (seta) seta.classList.toggle('rodada');
                });
            }
        }

        configurarDropdown('btnDropdownFii', 'conteudoFii', 'setaFii');
        configurarDropdown('btnDropdownAcoes', 'conteudoAcoes', 'setaAcoes');
    </script>

</body>
</html>
