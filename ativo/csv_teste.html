<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ler Arquivos CSV</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h2 {
            color: #e2e8f0;
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Tabela Estilo Base de Dados */
        .table-container {
            width: 100%;
            overflow-x: auto;
            background-color: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 30px;
        }
        .db-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }
        .db-table th {
            background-color: #334155;
            color: #cbd5e1;
            padding: 12px 10px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .db-table td {
            padding: 10px;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
        }
        .db-table tr:hover {
            background-color: #24334d;
        }
        
        /* Badges de Status Conforme o Modelo */
        .badge-pos {
            background-color: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .badge-neg {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .badge-info {
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .badge-wait {
            background-color: rgba(234, 88, 12, 0.1);
            color: #f97316;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(234, 88, 12, 0.2);
        }
        
        .status-msg {
            padding: 20px;
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Ler Arquivos CSV</h1>
    <p>O script abaixo fará a leitura de um arquivo ".csv" e apresentará a tabela na tela de forma personalizada.</p>

    <h2>Cronograma 2T26 - Data de Divulgação</h2>
    <div class="table-container">
        <table class="db-table">
            <thead>
                <tr>
                    <th>SIM</th>
                    <th>AÇÃO</th>
                    <th>DATA</th>
                    <th>RELATÓRIO</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="dados-tabela">
                <tr>
                    <td colspan="5" class="status-msg">Carregando dados do cronograma...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function carregarDados() {
        try {
            // Caminho atualizado para a pasta "csv"
            const resposta = await fetch('../csv/dados.csv');
            if (!resposta.ok) {
                throw new Error("Não foi possível carregar o arquivo em csv/dados.csv");
            }
            const texto = await resposta.text();
            
            const linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const tbody = document.getElementById('dados-tabela');
            
            tbody.innerHTML = '';

            for (let i = 1; i < linhas.length; i++) {
                // Modificado para split por ponto e vírgula se o seu CSV usar ';' como separador padrão brasileiro
                const colunas = linhas[i].split(','); 
                const tr = document.createElement('tr');
                
                colunas.forEach((valor, index) => {
                    const td = document.createElement('td');
                    const textoLimpo = valor.trim();
                    
                    // Coluna de STATUS (Índice 4) recebe a estilização em Badges
                    if (index === 4) {
                        const badge = document.createElement('span');
                        badge.textContent = textoLimpo;
                        
                        // Vincula o texto do CSV às classes correspondentes de cores
                        if (textoLimpo === 'Aguardando') {
                            badge.classList.add('badge-wait');
                        } else if (textoLimpo === 'Divulgado' || textoLimpo === 'Sucesso') {
                            badge.classList.add('badge-pos');
                        } else if (textoLimpo === 'Cancelado') {
                            badge.classList.add('badge-neg');
                        } else {
                            badge.classList.add('badge-info');
                        }
                        
                        td.appendChild(badge);
                    } else {
                        td.textContent = textoLimpo;
                    }
                    
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            }
        } catch (erro) {
            console.error("Erro ao ler o arquivo em csv/dados.csv:", erro);
            document.getElementById('dados-tabela').innerHTML = `
                <tr>
                    <td colspan="5" class="status-msg" style="color: #f87171;">
                        Erro ao carregar os dados. Verifique a existência e o formato do arquivo em 'csv/dados.csv'.
                    </td>
                </tr>
            `;
        }
    }

    window.addEventListener('DOMContentLoaded', carregarDados);
</script>
</body>
</html>
