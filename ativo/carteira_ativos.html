<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento de Ativos</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        
        .main-title {
            color: #38bdf8;
            font-size: 24px;
            margin: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .secao-container {
            width: 100%;
            background-color: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .db-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
            table-layout: fixed;
        }
        
        .db-table th:nth-child(1), .db-table td:nth-child(1) {
            width: 18%;
        }
        .db-table th:not(:nth-child(1)), .db-table td:not(:nth-child(1)) {
            width: 14%;
        }
        
        .db-table th {
            background-color: #334155;
            color: #cbd5e1;
            padding: 12px 10px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        
        .db-table th:hover {
            background-color: #3e4e68;
        }
        
        .db-table td {
            padding: 10px 14px;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .db-table tr:hover {
            background-color: #24334d;
        }
        
        .linhas-conteudo {
            display: none;
        }
        
        .seta-indicadora {
            display: inline-block;
            margin-right: 10px;
            transition: transform 0.2s;
            color: #38bdf8;
        }
        
        .aberto .seta-indicadora {
            transform: rotate(90deg);
        }
        
        .txt-centro {
            text-align: center;
        }
        
        .status-msg {
            padding: 30px;
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="titulo-sistema" class="main-title">Carregando Sistema...</h1>
        
        <div id="espaco-tabelas">
            <div class="status-msg">Processando base de dados de ativos...</div>
        </div>
    </div>

    <script>
        async function carregarAtivosConsolidados() {
            const espacoTabelas = document.getElementById('espaco-tabelas');
            const elementoTitulo = document.getElementById('titulo-sistema');
            
            try {
                const resposta = await fetch('../csv/carteira_ativos.csv');
                if (!resposta.ok) throw new Error('Não foi possível ler o arquivo ativos_plan.csv.');

                const buffer = await resposta.arrayBuffer();
                const decodificador = new TextDecoder('windows-1252');
                const texto = decodificador.decode(buffer);
                const linhas = texto.split('\n');

                let htmlGeral = '';
                let dentroDeTabela = false;

                linhas.forEach((linha) => {
                    const linhaLimpa = linha.trim();
                    if (linhaLimpa === '') return;

                    const colunas = linha.split(';');
                    const valoresPreenchidos = colunas.filter(c => c.trim() !== '');
                    
                    if (valoresPreenchidos.length === 0) return;

                    const linhaMaiuscula = linhaLimpa.toUpperCase();

                    if (linhaMaiuscula.includes('ATIVOS DA CARTEIRA')) {
                        elementoTitulo.innerText = linhaLimpa.replace(/;/g, '');
                        return; 
                    }

                    const ehCabecalhoCategoria = linhaMaiuscula.includes('AÇÕES') || 
                                                 linhaMaiuscula.includes('FIIS')  || 
                                                 linhaMaiuscula.includes('ETFS')  || 
                                                 linhaMaiuscula.includes('BDR')   || 
                                                 linhaMaiuscula.includes('RENDA FIXA');

                    if (ehCabecalhoCategoria) {
                        if (dentroDeTabela) {
                            htmlGeral += '</tbody></table></div>';
                        }
                        
                        htmlGeral += '<div class="secao-container"><table class="db-table"><thead><tr>';
                        
                        let ultimoIndicePreenchido = -1;
                        for (let i = colunas.length - 1; i >= 0; i--) {
                            if (colunas[i].trim() !== '') {
                                ultimoIndicePreenchido = i;
                                break;
                            }
                        }

                        colunas.forEach((coluna, colIndex) => {
                            const valor = coluna.trim();
                            let estiloHeader = colIndex === 0 ? 'text-align: left;' : 'text-align: center;';
                            
                            // Mantém o destaque em AZUL e NEGRITO apenas no último campo preenchido
                            if (colIndex === ultimoIndicePreenchido) {
                                estiloHeader += ' color: #38bdf8; font-weight: bold;';
                            }
                            
                            if (colIndex === 0) {
                                htmlGeral += `<th style="${estiloHeader}" onclick="alternarBloco(this)"><span class="seta-indicadora">▶</span>${valor}</th>`;
                            } else {
                                htmlGeral += `<th style="${estiloHeader}" onclick="alternarBloco(this)">${valor}</th>`;
                            }
                        });

                        htmlGeral += '</tr></thead><tbody class="linhas-conteudo">';
                        dentroDeTabela = true;
                    } else {
                        if (dentroDeTabela) {
                            htmlGeral += '<tr>';
                            colunas.forEach((coluna, colIndex) => {
                                const valor = coluna.trim();
                                const classeCelula = colIndex === 0 ? '' : 'class="txt-centro"';
                                htmlGeral += `<td ${classeCelula}>${valor}</td>`;
                            });
                            htmlGeral += '</tr>';
                        }
                    }
                });

                if (dentroDeTabela) {
                    htmlGeral += '</tbody></table></div>';
                }

                espacoTabelas.innerHTML = htmlGeral;

            } catch (erro) {
                espacoTabelas.innerHTML = `<div class="status-msg" style="color: #f87171;">Erro: ${erro.message}</div>`;
                elementoTitulo.innerText = "Falha no Carregamento";
            }
        }

        function alternarBloco(elementoTh) {
            const tabela = elementoTh.closest('table');
            const corpoConteudo = tabela.querySelector('.linhas-conteudo');
            
            const estaFechado = window.getComputedStyle(corpoConteudo).display === 'none';

            if (estaFechado) {
                corpoConteudo.style.display = 'table-row-group';
                tabela.classList.add('aberto');
            } else {
                corpoConteudo.style.display = 'none';
                tabela.classList.remove('aberto');
            }
        }

        window.onload = carregarAtivosConsolidados;
    </script>
</body>
</html>
