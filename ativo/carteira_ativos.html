<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Operacional de Carteira</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h2 {
            color: #e2e8f0;
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        
        .main-title {
            color: #38bdf8;
            font-size: 24px;
            margin: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Container único contínuo da Planilha */
        .table-container {
            width: 100%;
            overflow-x: auto;
            background-color: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .db-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
            table-layout: fixed; /* Gabarito rígido milimétrico */
        }
        
        /* GABARITO MATEMÁTICO: Distribuição proporcional das 7 colunas visíveis */
        .db-table th:nth-child(1), .db-table td:nth-child(1) { width: 22%; }
        .db-table th:nth-child(2), .db-table td:nth-child(2) { width: 11%; }
        .db-table th:nth-child(3), .db-table td:nth-child(3) { width: 13%; }
        .db-table th:nth-child(4), .db-table td:nth-child(4) { width: 11%; }
        .db-table th:nth-child(5), .db-table td:nth-child(5) { width: 13%; }
        .db-table th:nth-child(6), .db-table td:nth-child(6) { width: 14%; }
        .db-table th:nth-child(7), .db-table td:nth-child(7) { width: 16%; }
        
        .db-table td, .db-table th {
            padding: 8px 10px; /* Padding unificado compactado */
            text-align: left;  /* Alinhamento unificado totalmente à esquerda */
        }
        
        /* Linhas do Menu Principal (ID 0) - Acertado na cor do corpo da tabela */
        .db-table td.linha-id0 {
            background-color: #1e293b !important;
            cursor: pointer; /* Indica visualmente que a linha inteira é clicável */
            user-select: none; /* Impede seleção acidental de texto ao dar duplo clique */
        }
        
        /* Regra da Guia Ativa: Única linha do Submenu (ID 1) */
        .db-table tr.linha-id1-row td {
            background-color: #334155 !important;
            color: #ffffff !important;
            font-weight: bold !important;
            font-size: 13px !important;
        }
        
        /* Linhas do Ativo (ID >= 2) */
        .linha-dados td {
            border-bottom: none;
            color: #cbd5e1 !important;
            font-size: 13px;
            font-weight: normal;
        }
        
        /* Tracejado sutil apenas no início de cada bloco diferente */
        .inicio-bloco-id td {
            border-top: 1px dotted #475569;
        }
        
        .db-table tr:hover {
            background-color: #24334d;
        }
        
        /* Garante que o hover clareie o texto do ativo quando selecionado */
        .db-table tr.linha-dados:hover td {
            color: #f8fafc !important;
        }
        
        /* Trava o hover nas linhas do Submenu (ID 1) */
        .db-table tr.linha-id1-row:hover,
        .db-table tr.linha-id1-row:hover td {
            background-color: #334155 !important;
            color: #ffffff !important;
        }

        /* Permite que o Menu Principal (ID 0) responda ao mouse acendendo na cor correta */
        .db-table tr.id0-row-clickable:hover td.linha-id0 {
            background-color: #24334d !important;
            color: #38bdf8 !important;
        }

        /* Classe de controle para ocultar as linhas colapsadas */
        .row-hidden {
            display: none !important;
        }

        /* Pequeno indicador visual de estado aberto/fechado na primeira coluna do ID 0 */
        .toggle-icon {
            display: inline-block;
            margin-right: 6px;
            color: #38bdf8;
            font-size: 11px;
            transition: transform 0.2s ease;
        }
        .collapsed .toggle-icon {
            transform: rotate(-90deg); /* Gira a setinha se estiver fechado */
        }
        
        .status-msg {
            padding: 30px;
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ativos da Carteira</h1>
        
        <div id="tabela-gestao-container" class="table-container">
            <div class="status-msg">Processando base de dados operacional...</div>
        </div>
    </div>

<script>
    // Função global do Desafio: Abre e fecha o bloco correspondente ao ID 0 clicado
    window.alternarBloco = function(indexBloco) {
        const linhasFilhas = document.querySelectorAll(`.grupo-bloco-${indexBloco}`);
        const linhaMestre = document.getElementById(`mestre-bloco-${indexBloco}`);
        
        if (linhasFilhas.length === 0) return;

        // Verifica o estado atual olhando a primeira linha filha encontrada
        let estaEscondido = linhasFilhas[0].classList.contains('row-hidden');

        linhasFilhas.forEach(linha => {
            if (estaEscondido) {
                linha.classList.remove('row-hidden');
            } else {
                linha.classList.add('row-hidden');
            }
        });

        // Atualiza a rotação da setinha visual na linha mestre
        if (linhaMestre) {
            if (estaEscondido) {
                linhaMestre.classList.remove('collapsed');
            } else {
                linhaMestre.classList.add('collapsed');
            }
        }
    };

    async function carregarCarteiraGestao() {
        const containerTable = document.getElementById('tabela-gestao-container');
        
        try {
            // Número aleatório (?v=...) para estourar o cache do IIS permanentemente
            const resposta = await fetch('../csv/carteira_ativos.csv');
            if (!resposta.ok) throw new Error('Não foi possível ler o arquivo.');

            const buffer = await resposta.arrayBuffer();
            const decodificador = new TextDecoder('windows-1252');
            const texto = decodificador.decode(buffer);
            const lines = texto.split('\n');

            let htmlTabela = '<table class="db-table">';
            let idAnterior = null;
            
            // Vetor de memória de herança para os 7 campos visíveis de dados
            let valoresLinhaAnterior = Array(7).fill('');
            let titulosId0Temporario = null;

            // Contador para vincular e agrupar dinamicamente os pais (ID 0) com os filhos (ID 1 e 2)
            let contadorBlocos = 0;

            lines.forEach((linha) => {
                const linhaLimpa = linha.trim();
                if (linhaLimpa === '') return;

                // Fatiamento seguro por item de texto puro (1 ID + 7 dados)
                const colunasBrutas = linhaLimpa.split(';');
                const listaCampos = colunasBrutas.map(campo => campo.trim());
                
                // Ajusta o vetor para ter exatamente as 8 posições físicas
                while(listaCampos.length < 8) listaCampos.push('');

                // Captura o ID isolado na primeira posição e valida numericamente
                const idRow = parseInt(listaCampos[0]);
                if (isNaN(idRow)) return;

                // Separa os 7 campos de dados purificados na tela
                let dadosVisiveis = listaCampos.slice(1, 8);

                // Incrementa o contador de árvore toda vez que um NOVO Menu Principal (ID 0) inicia
                if (idRow === 0 && idAnterior !== 0 && idAnterior !== null) {
                    const ehTitulo = dadosVisiveis.some(v => v.toUpperCase() === 'VARIAÇÃO' || v.toUpperCase() === 'ATIVOS' || v.toUpperCase() === 'VALOR TOTAL');
                    if (ehTitulo) {
                        contadorBlocos++;
                    }
                }
                
                // Linha tracejada sutil na mudança de grandes grupos (IDs 0 ou 1)
                let classeSeparadoraID = '';
                if (idAnterior !== null && idRow !== idAnterior) {
                    if (idRow === 0 || idRow === 1) {
                        classeSeparadoraID = 'inicio-bloco-id';
                    }
                }
                idAnterior = idRow;

                // 1. REGRA DO MENU PRINCIPAL (ID 0) - EMPILHAMENTO CONCEITUAL
                if (idRow === 0) {
                    const ehLinhaTituloId0 = dadosVisiveis.some(v => v.toUpperCase() === 'VARIAÇÃO' || v.toUpperCase() === 'ATIVOS' || v.toUpperCase() === 'VALOR TOTAL');

                    if (ehLinhaTituloId0) {
                        titulosId0Temporario = [...dadosVisiveis];
                        return; 
                    } else {
                        if (titulosId0Temporario === null) {
                            titulosId0Temporario = ["", "", "", "Variação", "Ativos", "% na carteira", "Valor Total"];
                        }

                        // Configura a linha mestre com ID único e o gatilho onclick
                        // Inicia com a classe 'collapsed' (fechada) por padrão
                        htmlTabela += `<tr id="mestre-bloco-${contadorBlocos}" class="id0-row-clickable collapsed ${classeSeparadoraID}" onclick="alternarBloco(${contadorBlocos})">`;
                        
                        dadosVisiveis.forEach((conteudo, colIndex) => {
                            let titulo = titulosId0Temporario[colIndex] || '';
                            
                            // Injeta a setinha visual unicamente no campo 1 (Nome da categoria)
                            let prefixoIcone = colIndex === 0 ? '<span class="toggle-icon">▼</span>' : '';

                            htmlTabela += `<td class="linha-id0">
                                <div style="font-size: 10px; color: #94a3b8; font-weight: normal; margin-bottom: 2px;">${titulo}</div>
                                <div style="font-size: 13px; color: #38bdf8; font-weight: bold; display: flex; align-items: center;">${prefixoIcone}${conteudo}</div>
                            </td>`;
                        });
                        htmlTabela += '</tr>';
                        titulosId0Temporario = null;
                    }
                } 
                // 2. REGRA DO SUBMENU (ID 1) - UMA LINHA FILHA (INICIA FECHADA)
                else if (idRow === 1) {
                    htmlTabela += `<tr class="linha-id1-row grupo-bloco-${contadorBlocos} row-hidden ${classeSeparadoraID}">`;
                    dadosVisiveis.forEach((campo, colIndex) => {
                        let estiloRecuo = colIndex === 0 ? 'style="padding-left: 15px; border-left: 3px solid #475569;"' : '';
                        htmlTabela += `<td ${estiloRecuo}>${campo}</td>`;
                    });
                    htmlTabela += '</tr>';
                } 
                // 3. CONTEÚDO DOS ATIVOS (ID >= 2) - LINHAS FILHAS (INICIAM FECHADAS)
                else {
                    let camposEramVazios = Array(7).fill(false);

                    for (let i = 0; i < dadosVisiveis.length; i++) {
                        if (dadosVisiveis[i] === '') {
                            camposEramVazios[i] = true;
                            if (valoresLinhaAnterior[i] !== '') {
                                dadosVisiveis[i] = valoresLinhaAnterior[i];
                            }
                        }
                    }
                    valoresLinhaAnterior = [...dadosVisiveis];

                    htmlTabela += `<tr class="linha-dados grupo-bloco-${contadorBlocos} row-hidden">`;
                    dadosVisiveis.forEach((valorCampo, colIndex) => {
                        let estiloSuave = colIndex === 0 ? 'style="padding-left: 28px; border-left: 3px solid #334155;' : 'style="';
                        
                        if (camposEramVazios[colIndex]) {
                            estiloSuave += ' opacity: 0.20; font-style: italic;';
                        }
                        estiloSuave += '"';

                        htmlTabela += `<td ${estiloSuave}>${valorCampo}</td>`;
                    });
                    htmlTabela += '</tr>';
                }
            });

            htmlTabela += '</table>';
            containerTable.innerHTML = htmlTabela;

        } catch (erro) {
            containerTable.innerHTML = `<div class="status-msg" style="color: #f87171;">Erro de carregamento: ${erro.message}</div>`;
        }
    }

    window.onload = carregarCarteiraGestao;
</script>

</body>
</html>
