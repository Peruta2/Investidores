<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consolidador da Carteira - Minha Carteira</title>
    <!-- Estilos Globais Unificados -->
    <link rel="stylesheet" href="../css/carteira.css">
    <!-- Chamada Local Oficial Compilada (UMD) Imune a Erros de Certificado -->
    <script src="../js/chart.js"></script>
    <style>
        body {
            background-color: var(--azul-marinho);
            margin: 0;
            padding: 30px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--branco);
        }
        .header-modulo h1 {
            color: var(--laranja-claro-dourado);
            margin: 0 0 25px 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(229, 196, 149, 0.2);
            padding-bottom: 10px;
        }
        /* Dashboard Layout: Grid Rígido de 5 Colunas no Topo (4 KPI + 1 Gráfico) */
        .kpi-cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr) !important;
            gap: 15px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background-color: var(--azul-escuro-tab);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--laranja-claro-dourado);
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .kpi-card .card-titulo {
            font-size: 11px;
            color: var(--cinza-claro-azulado);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .kpi-card .card-valor {
            font-size: 22px;
            font-weight: bold;
            color: var(--branco);
        }
        .kpi-card .card-sub {
            font-size: 12px;
            color: var(--azul-claro-brilhoso);
            margin-top: 4px;
            font-weight: 600;
        }
        
        /* O Quarto Bloco abriga o Gráfico Real + Legenda Impressa na Direita */
        .chart-box-card {
            background-color: var(--azul-escuro-tab);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            height: 100%;
            min-height: 110px;
            border-left: 4px solid var(--azul-claro-brilhoso);
            box-sizing: border-box;
        }
        
        /* Contêiner da Legenda Customizada Lateral Premium */
        .chart-legenda-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            justify-content: center;
        }
        .legenda-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--branco);
            font-weight: 600;
        }
        .legenda-classe-flex {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--cinza-claro-azulado);
            font-weight: normal;
        }
        .legenda-cor-quadrado {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        
        /* Seções de Tabelas Contínuas Modernas */
        .secao-tabela-bloco {
            margin-bottom: 35px;
            background-color: var(--azul-escuro-tab);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .secao-titulo {
            font-size: 14px;
            font-weight: bold;
            color: var(--laranja-claro-dourado);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-msg {
            padding: 30px;
            text-align: center;
            color: var(--cinza-claro-azulado);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-modulo">
        <h1>Módulo 2: Consolidador da Carteira</h1>
    </div>

    <!-- PAINEL EXECUTIVO DINÂMICO: 3 KPI CARDS REAIS + 1 CARD GRÁFICO (id70 / id20) -->
    <div id="kpi-cards-real-container" class="kpi-cards-grid">
        <div class="status-msg">Carregando consolidador e painel de alocação real...</div>
    </div>

    <!-- TABELA ID 20: POSIÇÃO CONSOLIDADA POR CLASSES REAIS -->
    <div class="secao-tabela-bloco">
        <div class="secao-titulo">➔ Posição Consolidada por Classes de Ativos</div>
        <div class="table-container" id="container-id20-tabela">
            <div class="status-msg">Processando matrizes de custos e saldos reais...</div>
        </div>
    </div>

    <!-- TABELA ID 40: EXTRATO GRANULAR DE ATIVOS EM CARTEIRA -->
    <div class="secao-tabela-bloco">
        <div class="secao-titulo">➔ Extrato Granular de Ativos em Carteira</div>
        <div class="table-container" id="container-id40-tabela">
            <div class="status-msg">Processando cotações, variações e yields...</div>
        </div>
    </div>

    <!-- Cérebro Lógico Otimizado para 13 Colunas Físicas -->
    <script src="../js/carteira_consolidador.js"></script>
</body>
</html>
